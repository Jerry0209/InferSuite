#------------------------------------------------------------------------------
# SPEC CPU 2026 config — microarchitectural characterisation build
#
#   Project : SPEC-vs-agentic microarchitectural bottleneck comparison
#   Machine : Intel Xeon w5-3425 (Sapphire Rapids), 12 P-cores, SMT on
#   Purpose : NON-REPORTABLE. We want counters, not scores.
#
#   Derived from the kit's config/Example-gcc-linux-x86.cfg (all PORTABILITY
#   sections kept verbatim — they are the vendor's own workarounds).
#
#   Deltas vs the example, and why:
#     - gcc/g++/gfortran 14.2 (Ubuntu 24.04 archive) instead of the system 13.3.
#       SPEC tested the kit with gcc 15.2 and warns that older system compilers
#       may fail; 14.2 is the newest in the distro archive.
#     - copies = 1, threads = 1        (single-copy / single-thread; PI decision)
#     - iterations = 1                 (one episode = one benchmark, one iteration)
#     - reportable = 0, tune = base    (no peak, non-reportable)
#     - label = uarch
#
#   AUTHORITATIVE COPY lives in this repo at config/uarch-gcc14.cfg and is
#   copied into $SPEC/config/ by scripts/build_one.sh. Edit here, never there.
#------------------------------------------------------------------------------


#--------- Label --------------------------------------------------------------
%ifndef %{label}
   label   = uarch
%else
   label   = %{label}
%endif


#--------- Preprocessor -------------------------------------------------------
%ifndef %{build_ncpus}
%   define  build_ncpus 8
%endif


#--------- Global Settings ----------------------------------------------------
default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
# SPECrate, single copy, single thread. This is the whole point of the study:
# one benchmark thread on an otherwise-silent 20-logical-CPU measured partition,
# so every counter belongs to one architectural context.
default:
   copies                 = 1
   threads                = 1


#------- Compilers ------------------------------------------------------------
default:
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif

%define GCCge10

   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)gcc-14      -std=c18     -m64
   CXX                     = $(SPECLANG)g++-14      -std=c++17   -m64
   FC                      = $(SPECLANG)gfortran-14 -std=f2018   -m64
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version


#--------- Portability --------------------------------------------------------
# Verbatim from Example-gcc-linux-x86.cfg.

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#----------------------------------------------------------------------
#       GCC workarounds that do not count as PORTABILITY
#----------------------------------------------------------------------
%ifdef %{GCCge10}
   default:
      EXTRA_FFLAGS = -fallow-argument-mismatch
%endif


#-------- Tuning Flags common to Base and Peak --------------------------------
# NOTE: the openmp and doconcurrent benchsets contain ONLY _s (speed)
# benchmarks, so those sections never fire for this rate-only campaign.
# cxxthreads does contain rate members (706, 723, 735, 766, 772) but SPEC
# compiles those with -DSPEC_AUTO_SUPPRESS_THREADING for rate; -pthread here
# only satisfies the link.
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=8
openmp:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread


#--------  Base Tuning Flags ----------------------------------------------
# PI decision: SPEC-standard gcc base. -march=native enables AVX-512 on
# Sapphire Rapids. Documented caveat for the agentic comparison: SPEC ends up
# considerably more vectorised than the distro-built agentic stack.
default=base:
   OPTIMIZE       = -g -O3 -march=native


#--------  Peak Tuning Flags ----------------------------------------------
default:
   basepeak = yes
default=peak:


#------------------------------------------------------------------------------
# Descriptions — non-reportable run, informational only.
#------------------------------------------------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: Version 14.2.0 of GCC, the
   sw_compiler002   = GNU Compiler Collection
   sw_compiler_category = Community
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = Not Applicable

default:
   hw_vendor          = Lenovo
   tester             = uarch-study
   test_sponsor       = uarch-study
   license_num        = non-reportable

default:
   hw_cpu_name        = Intel Xeon w5-3425
   hw_model           = ThinkStation P7
   hw_nchips          = 1
   hw_ncores          = 12
   hw_nthreadspercore = 2
   hw_ncpuorder       = 1 chip
   hw_cooling         = Air
   hw_other           = None
   hw_memory001       = 62 GB
   hw_pcache          = 48 KB I + 32 KB D on chip per core
   hw_scache          = 2 MB I+D on chip per core
   hw_tcache          = 30 MB I+D on chip per chip
   hw_ocache          = None
   sw_file            = ext4
   sw_os001           = Ubuntu 24.04
   sw_os002           = kernel 6.17.0-1030-oem
   sw_other           = None
   sw_state           = Multi-user, run level 3
   power_management   = performance governor, no_turbo=1, nohz_full on measured cores
