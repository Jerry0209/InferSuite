#------------------------------------------------------------------------------
# SPEC CPU 2026 config — microarchitectural characterisation build, AArch64
#
#   Project : SPEC-vs-agentic microarchitectural bottleneck comparison (ARM side)
#   Machine : AWS EC2 c9gd.metal-48xl, Graviton5 (192 x Neoverse-V3), hw_* from lscpu 2026-11-03
#   Purpose : NON-REPORTABLE. We want counters, not scores.
#
#   Derived from the x86 twin uarch-gcc14.cfg (same deltas vs SPEC's examples,
#   same PORTABILITY sections) with the AArch64 changes taken from the kit's own
#   config/Example-gcc-linux-aarch64.cfg:
#     - -mabi=lp64 replaces the x86 pointer-size flag on CC/CXX/FC
#     - OPTIMIZE = -g -O3 -mcpu=native   (AArch64 analogue of the x86 native
#       arch flag, which on x86 also implies native tuning)
#   Kept identical to x86: gcc/g++/gfortran 14 (Ubuntu 24.04 archive), copies=1,
#   threads=1, iterations=1, reportable=0, tune=base, label=uarch.
#   Record `gcc-14 -mcpu=native -Q --help=target | grep -E "mcpu|march"` in the
#   session log: if GCC 14 does not know the core it falls back to generic +
#   detected features, which is a fact about the build worth writing down.
#------------------------------------------------------------------------------

#--------- Label --------------------------------------------------------------
%ifndef %{label}
   label   = uarch
%else
   label   = %{label}
%endif


#--------- Preprocessor -------------------------------------------------------
%ifndef %{build_ncpus}
%   define  build_ncpus 8
%endif


#--------- Global Settings ----------------------------------------------------
default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,csv
   preenv               = 1
   reportable           = 0
   tune                 = base


#--------- How Many CPUs? -----------------------------------------------------
# SPECrate, single copy, single thread. This is the whole point of the study:
# one benchmark thread on an otherwise-silent 20-logical-CPU measured partition,
# so every counter belongs to one architectural context.
default:
   copies                 = 1
   threads                = 1


#------- Compilers ------------------------------------------------------------
default:
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif

%define GCCge10

   SPECLANG                = %{gcc_dir}/bin/
   CC                      = $(SPECLANG)gcc-14      -std=c18     -mabi=lp64
   CXX                     = $(SPECLANG)g++-14      -std=c++17   -mabi=lp64
   FC                      = $(SPECLANG)gfortran-14 -std=f2018   -mabi=lp64
   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version
   FC_VERSION_OPTION       = --version


#--------- Portability --------------------------------------------------------
# Verbatim from Example-gcc-linux-x86.cfg (identical in Example-gcc-linux-aarch64.cfg).

800.pot3d_s:
  PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs


#----------------------------------------------------------------------
#       GCC workarounds that do not count as PORTABILITY
#----------------------------------------------------------------------
%ifdef %{GCCge10}
   default:
      EXTRA_FFLAGS = -fallow-argument-mismatch
%endif


#-------- Tuning Flags common to Base and Peak --------------------------------
# NOTE: the openmp and doconcurrent benchsets contain ONLY _s (speed)
# benchmarks, so those sections never fire for this rate-only campaign.
# cxxthreads does contain rate members (706, 723, 735, 766, 772) but SPEC
# compiles those with -DSPEC_AUTO_SUPPRESS_THREADING for rate; -pthread here
# only satisfies the link.
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M
doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=8
openmp:
   EXTRA_OPTIMIZE  = -fopenmp -DSPEC_OPENMP
cxxthreads:
   EXTRA_OPTIMIZE  = -pthread


#--------  Base Tuning Flags ----------------------------------------------
# Same intent as the x86 twin: SPEC-standard gcc base, tuned for the build host.
# On Graviton this enables SVE/SVE2 where the core has them.
default=base:
   OPTIMIZE       = -g -O3 -mcpu=native


#--------  Peak Tuning Flags ----------------------------------------------
default:
   basepeak = yes
default=peak:


#------------------------------------------------------------------------------
# Descriptions — non-reportable run, informational only.
#------------------------------------------------------------------------------
default:
   sw_compiler001   = C/C++/Fortran: Version 14.2.0 of GCC, the
   sw_compiler002   = GNU Compiler Collection
   sw_compiler_category = Community
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = Not Applicable

default:
   hw_vendor          = Amazon Web Services
   tester             = uarch-study
   test_sponsor       = uarch-study
   license_num        = non-reportable

default:
   hw_cpu_name        = AWS Graviton5 (Arm Neoverse-V3, MIDR 0x410fd841)
   hw_model           = AWS EC2 c9gd.metal-48xl
   hw_nchips          = 1
   hw_ncores          = 192
   hw_nthreadspercore = 1
   hw_ncpuorder       = 1 chip
   hw_cooling         = Air
   hw_other           = None
   hw_memory001       = 377 GiB (2 NUMA nodes)
   hw_pcache          = 64 KB I + 64 KB D on chip per core
   hw_scache          = 2 MB I+D on chip per core
   hw_tcache          = 192 MB I+D on chip per chip (2 instances per lscpu)
   hw_ocache          = None
   sw_file            = ext4
   sw_os001           = Ubuntu 24.04
   sw_os002           = kernel 6.17.0-1017-aws
   sw_other           = None
   sw_state           = Multi-user, run level 3
   power_management   = fixed frequency (Graviton), 8 measured + 8 housekeeping cores
