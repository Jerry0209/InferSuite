# campaign.conf — SPEC CPU 2026 microarchitectural campaign.
# Mirrors InferSuite's local_agents/scripts/glm/campaign.conf so the two campaigns
# stay comparable. Env wins over file.

# ---- CPU partition (Xeon w5-3425: 12 P-cores) ----------------------------------
# PARTITION_PROFILE=auto detects the SMT state at run time and picks the matching
# split, because the logical-CPU numbering CHANGES when SMT is disabled in BIOS:
#
#   SMT ON  (24 logical, siblings N / N+12)
#       measured 2-11,14-23   (10 physical cores + their siblings = 20 logical)
#       house    0-1,12-13
#   SMT OFF (12 logical, one thread per core)
#       measured 2-11         (the SAME 10 physical cores)
#       house    0-1
#
# Either way the workload gets the same ten physical cores, so the comparison is
# about SMT, not about core count. Set CPUS_MEASURED/CPUS_HOUSE explicitly to
# override; HOUSE_IRQ_MASK is then derived from CPUS_HOUSE automatically and never
# has to be hand-computed again.
#
# 2026-08-05 — PINNED, auto-detect deliberately overridden. This is a SHARED machine
# and it was rebooted into another campaign's partition, which we adopt rather than
# fight (PI decision). The box came up with CPUs 16-23 OFFLINE, i.e. SMT half off:
#
#     cores 4-11  -> siblings offlined  => 8 genuinely SMT-free physical cores
#     cores 0-3   -> siblings 12-15 live
#
# So `lscpu` still says "Thread(s) per core: 2" and auto-detect would pick the SMT-ON
# profile 2-11,14-23 — which names offline CPUs (resolve_partition FATALs, correctly)
# and would also collide with the other campaign's measured set. The boot cmdline
# already gives us irqaffinity=0-3,12-15, workqueue.unbound_cpus=0-3,12-15,
# nmi_watchdog=0 and transparent_hugepage=never, so the house set below matches the
# steering the kernel is already doing. Derived HOUSE_IRQ_MASK = f00f.
#
# NOTE: nohz_full/rcu_nocbs are NOT on this cmdline (they were on the previous boot).
# The measured cores still take their local timer tick; preflight warns about it.
PARTITION_PROFILE="${PARTITION_PROFILE:-pinned}"
CPUS_MEASURED="${CPUS_MEASURED:-4-11}"         # 8 SMT-free physical cores
CPUS_HOUSE="${CPUS_HOUSE:-0-3,12-15}"          # 4 cores + their siblings
MSLICE="${MSLICE:-measured.slice}"             # top-level slice the fence lives under

# ---- windowed counting ---------------------------------------------------------
# 2026-08-05: WINSEC = 0.1 s (100 ms), set by the PI.
#
# MEASURED CONSEQUENCE, stated because it belongs in the method section: relaunching
# perf per window costs a FIXED ~20 ms (measured: 19.9 ms at 0.1 s, 20.3 ms at 1 s,
# 19.9 ms at 5 s), so a 100 ms window runs 120 ms wall and the counters are live for
# 83.4% of the episode, versus 99.6% at 5 s. The dead time sits BETWEEN windows and is
# uncorrelated with program phase; with a shuffled rotation and hundreds of rotations
# per episode it does not bias the episode-SUM ratios, but ~17% of wall time is not
# observed by the windowed groups. The continuous TMA census is unaffected — it stays
# installed for the whole episode at 100% duty.
#
# UPSIDE: a full 11-group rotation is now 1.32 s instead of 55 s, so every benchmark
# completes many rotations on its FIRST ref command line. All nine command-line
# escalations and all three per-benchmark WINSEC overrides became unnecessary and were
# retired; cmd_index.tsv is back to index 0 everywhere, which is the PI's original rule
# ("first line, escalate only if too short") now that nothing is too short.
WINSEC="${WINSEC:-0.1}"
WINSEC_DEFAULT="$WINSEC"

# ---- SPEC run parameters -------------------------------------------------------
SPEC_SIZE="${SPEC_SIZE:-refrate}"              # PI: ALWAYS ref. refrate = rate ref inputs.
SPEC_CMD_INDEX="${SPEC_CMD_INDEX:-0}"          # PI: benchmarks with several ref command
                                               # lines run exactly ONE. 0 = first. All of
                                               # them are banked to speccmds_all.txt and the
                                               # chosen index goes into metadata.json.
EPISODE_MAX_S="${EPISODE_MAX_S:-10800}"        # hard fuse per episode (3 h)
# 5 full rotations (55 windows = 6.6 s). At WINSEC=5 the floor was one rotation because
# episodes barely managed that; at 100 ms even the shortest ref line (736.ocio_r idx0,
# 9.2 s) yields 76 windows, so the floor can demand real statistical support.
MIN_WINDOWS="${MIN_WINDOWS:-55}"

# ---- occupancy gate ------------------------------------------------------------
# copies=1 / threads=1 must mean ONE runnable thread. If mean fence occupancy exceeds
# this, the benchmark spawned helpers and its uarch profile is a blend — the episode
# is flagged, not silently averaged.
MAX_MEAN_CORES="${MAX_MEAN_CORES:-1.05}"

# ---- data ----------------------------------------------------------------------
DATA_ROOT="${DATA_ROOT:-$INFRA/data}"
